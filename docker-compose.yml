version: '3.9'

services:
  server:
    image: node:20-alpine
    container_name: crypto-watch-server
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    ports:
      - '4000:4000'
    environment:
      PORT: '4000'
      CLIENT_ORIGIN: 'http://localhost:3000'
      NODE_ENV: development
    restart: unless-stopped

  client:
    image: node:20-alpine
    container_name: crypto-watch-client
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
      - client_next:/app/.next
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_WS_BASE: 'ws://localhost:4000/ws'
      NODE_ENV: development
    depends_on:
      - server
    restart: unless-stopped

volumes:
  server_node_modules:
  client_node_modules:
  client_next:
