version: '3.9'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: crypto-watch-server:dev
    container_name: crypto-watch-server
    ports:
      - '4000:4000'
    environment:
      PORT: '4000'
      CLIENT_ORIGIN: 'http://localhost:3000'
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: crypto-watch-client:dev
    container_name: crypto-watch-client
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_BASE: 'http://localhost:4000'
      NEXT_PUBLIC_WS_BASE: 'ws://localhost:4000/ws'
    depends_on:
      - server
    restart: unless-stopped
